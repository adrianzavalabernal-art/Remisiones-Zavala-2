const tbody=document.getElementById('rows'),fmt=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});let currentId=null;let strokes=[],activeStroke=null,penOn=false;const ink=document.getElementById("ink"),ctx=ink.getContext("2d"),page=document.getElementById("page");
function fraction(s){s=String(s||'').trim().replace(/,/g,'.');if(!s)return null;let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+(+m[2]/+m[3]);m=s.match(/^(\d+)\/(\d+)$/);if(m)return +m[1]/+m[2];if(/^\d+(?:\.\d+)?$/.test(s))return +s;return NaN}
function price(s){s=String(s||'').replace(/[$,\s]/g,'');return s===''?null:/^\d+(?:\.\d+)?$/.test(s)?+s:NaN}
for(let i=0;i<27;i++){const tr=document.createElement('tr');tr.innerHTML='<td><input class="cell qty" aria-label="Cantidad '+(i+1)+'" inputmode="text"></td><td><input class="cell desc" aria-label="Descripción '+(i+1)+'"></td><td><input class="cell unit money" aria-label="Precio unitario '+(i+1)+'" inputmode="decimal"></td><td><input class="cell amount money" aria-label="Importe '+(i+1)+'" readonly tabindex="-1"></td>';tbody.appendChild(tr)}
function calc(){let sum=0;for(const tr of tbody.rows){const q=tr.querySelector('.qty'),p=tr.querySelector('.unit'),a=tr.querySelector('.amount');const n=fraction(q.value),v=price(p.value);q.classList.toggle('warn',Number.isNaN(n));p.classList.toggle('warn',Number.isNaN(v));if(n!==null&&v!==null&&Number.isFinite(n)&&Number.isFinite(v)){const val=Math.round((n*v+Number.EPSILON)*100)/100;a.value=fmt.format(val);sum+=val}else a.value=''}document.getElementById('total').textContent=fmt.format(sum)}
function today(){let d=new Date(),local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}
function clear(){currentId=null;strokes=[];drawInk();document.getElementById('fecha').value=today();document.getElementById('cliente').value='';document.querySelectorAll('tbody input:not(.amount)').forEach(x=>x.value='');calc();document.getElementById('status').textContent='Remisión nueva lista para editar'}
function snapshot(){return {fecha:document.getElementById('fecha').value,cliente:document.getElementById('cliente').value,items:[...tbody.rows].map(tr=>[...tr.querySelectorAll('input:not(.amount)')].map(x=>x.value)),strokes:strokes}}
function load(v){strokes=Array.isArray(v.strokes)?v.strokes:[];drawInk();document.getElementById('fecha').value=v.fecha||today();document.getElementById('cliente').value=v.cliente||'';[...tbody.rows].forEach((tr,i)=>[...tr.querySelectorAll('input:not(.amount)')].forEach((x,j)=>x.value=v.items?.[i]?.[j]||''));calc()}
function getAll(){try{return JSON.parse(localStorage.getItem('zavala_a5_notes')||'{}')}catch{return {}}}
function refresh(){let sel=document.getElementById('saved'),all=getAll();sel.innerHTML='<option value="">Mis remisiones</option>';Object.entries(all).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([id,v])=>{let opt=document.createElement('option');opt.value=id;opt.textContent=(v.cliente||'Sin cliente')+' · '+(v.fecha||'Sin fecha');sel.appendChild(opt)});sel.value=currentId||''}
document.getElementById('save').onclick=()=>{let all=getAll();currentId=currentId||String(Date.now());all[currentId]=snapshot();try{localStorage.setItem('zavala_a5_notes',JSON.stringify(all));refresh();document.getElementById('status').textContent='Guardada en este navegador'}catch{alert('No se pudo guardar en este navegador. Usa Imprimir / PDF para conservarla.')}};
document.getElementById('saved').onchange=e=>{let id=e.target.value,all=getAll();if(id&&all[id]){currentId=id;load(all[id])}};
document.getElementById('new').onclick=()=>{if(confirm('¿Crear una remisión nueva? Guarda la actual primero si la necesitas.')){clear();refresh()}};
document.getElementById('delete').onclick=()=>{if(!currentId){alert('Primero selecciona una remisión guardada para eliminarla.');return}if(!confirm('¿Eliminar esta remisión guardada? Esta acción no se puede deshacer.'))return;const all=getAll();delete all[currentId];try{localStorage.setItem('zavala_a5_notes',JSON.stringify(all));clear();refresh();document.getElementById('status').textContent='Remisión eliminada'}catch{alert('No se pudo eliminar')}};
document.getElementById('erase').onclick=()=>{if(confirm('¿Borrar los datos y la tinta de la hoja actual? Las notas guardadas no se eliminan.')){const keep=currentId;clear();currentId=keep;refresh();document.getElementById('status').textContent='Datos de la hoja borrados. Pulsa Guardar para actualizar la nota guardada.'}};
function setPen(on){penOn=on;page.classList.toggle('inking',on);document.getElementById('pen').classList.toggle('active',on);document.getElementById('pen').setAttribute('aria-pressed',String(on));document.getElementById('pen').textContent=on?'✏️ Apple Pencil: activado':'✏️ Apple Pencil: desactivado';document.getElementById('undo').hidden=!on;document.getElementById('clearink').hidden=!on;document.getElementById('status').textContent=on?'Escribe con Apple Pencil o dedo sobre la hoja. Desactívalo para editar celdas y calcular importes.':'Modo teclado: toca las celdas para editar y calcular.'}
document.getElementById('pen').onclick=()=>setPen(!penOn);
document.getElementById('undo').onclick=()=>{strokes.pop();drawInk()};
document.getElementById('clearink').onclick=()=>{if(confirm('¿Borrar todos los trazos escritos a mano?')){strokes=[];drawInk()}};
function resizeInk(){const w=page.clientWidth,h=page.clientHeight,dpr=window.devicePixelRatio||1;ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);ctx.setTransform(ink.width/w,0,0,ink.height/h,0,0);drawInk()}
function drawInk(){if(!ctx)return;const w=page.clientWidth,h=page.clientHeight;ctx.clearRect(0,0,w,h);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#151515';for(const stroke of strokes){const pts=stroke.points||[];if(!pts.length)continue;ctx.lineWidth=stroke.width||1.4;ctx.beginPath();ctx.moveTo(pts[0][0]*w,pts[0][1]*h);if(pts.length===1){ctx.lineTo(pts[0][0]*w+.15,pts[0][1]*h+.15)}else for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0]*w,pts[i][1]*h);ctx.stroke()}}
function inkPoint(e){const r=ink.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
ink.addEventListener('pointerdown',e=>{if(!penOn)return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();ink.setPointerCapture(e.pointerId);activeStroke={width:e.pointerType==='pen'?1.25:1.6,points:[inkPoint(e)]};strokes.push(activeStroke);drawInk()});
ink.addEventListener('pointermove',e=>{if(!activeStroke)return;e.preventDefault();activeStroke.points.push(inkPoint(e));drawInk()});
for(const type of ['pointerup','pointercancel','lostpointercapture'])ink.addEventListener(type,()=>{activeStroke=null});
window.addEventListener('resize',resizeInk);
document.getElementById('print').onclick=()=>{calc();window.print()};tbody.addEventListener('input',calc);clear();refresh();resizeInk();
function fit(){let w=window.innerWidth;if(w<580){document.documentElement.style.setProperty('--scale',Math.min(1,(w-12)/560))}else document.documentElement.style.setProperty('--scale',1)}window.addEventListener('resize',fit);fit();resizeInk();
</script></body></html>
